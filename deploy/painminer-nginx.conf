# nginx server block for painminer.muisbien.com.
# Installed by deploy/droplet/painminer-deploy.sh to /etc/nginx/sites-available/painminer
# and symlinked into /etc/nginx/sites-enabled/.
#
# TLS: uses a Cloudflare Origin CA certificate so the Cloudflare ↔ origin leg is
# also encrypted (Cloudflare Full/Strict mode). The cert is NOT Let's Encrypt and
# does NOT auto-renew — a 15-year Cloudflare Origin cert is the recommended choice.
#
# One-time cert setup (do this before deploying or re-deploying):
#   1. Cloudflare dashboard → SSL/TLS → Origin Server → Create Certificate
#      Choose 15-year validity, cover *.muisbien.com + muisbien.com
#   2. Copy the cert and key to the droplet:
#        /etc/ssl/cloudflare/origin.crt   (the certificate)
#        /etc/ssl/cloudflare/origin.key   (the private key, chmod 640, owned root:root)
#   3. Switch Cloudflare SSL/TLS mode to "Full (strict)" for muisbien.com
#
# Auth model: login.html is the custom HTML login gate. Only /config.js requires
# nginx basic auth (it holds the Supabase keys + RPC secret). All other static
# files are served without auth — the JS in each page redirects unauthenticated
# users to /login.html before making any Supabase calls.
#
# Static site root: /var/www/painminer (owned by www-data).

# Redirect all plain-HTTP traffic to HTTPS.
server {
    listen 80;
    server_name painminer.muisbien.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name painminer.muisbien.com;

    ssl_certificate     /etc/ssl/cloudflare/origin.crt;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /var/www/painminer;
    index index.html;

    # Security headers. nginx add_header in a child location block overrides ALL
    # parent-level add_header directives, so these are also repeated in each
    # specific location block below to guarantee coverage everywhere.
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # config.js holds Supabase keys + RPC secret — require basic auth.
    location = /config.js {
        auth_basic "Pain Miner";
        auth_basic_user_file /etc/nginx/painminer.htpasswd;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }

    # Never cache the app shell or login page.
    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }
    location = / {
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }
    location = /login.html {
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    access_log /var/log/nginx/painminer.access.log;
    error_log  /var/log/nginx/painminer.error.log;
}
